substitutions:
  _REGION: us-central1
  _SERVICE: rumor-room
  _REPOSITORY: rumor-room

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=rumor-room-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      # Session ledger is in-process; see docs/ARCHITECTURE.md "Session state and instance count".
      - --max-instances=1
      - --concurrency=40
      - --timeout=120
      - --set-env-vars=APP_ENV=production,INVESTIGATION_MODE=live,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GOOGLE_GENAI_USE_ENTERPRISE=true,GOOGLE_MODEL=gemini-3.7-flash
      - --set-secrets=PARALLEL_API_KEY=parallel-api-key:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
